<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{{ page.title | default: site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.9.0/github-markdown.min.css">
    <style>
      body {
        margin: 0;
      }
      @media (prefers-color-scheme: light) {
        body { background-color: #ffffff; }
      }
      @media (prefers-color-scheme: dark) {
        body { background-color: #0d1117; }
      }
      .markdown-body {
        box-sizing: border-box;
        min-width: 200px;
        max-width: 980px;
        margin: 0 auto;
        padding: 32px;
      }
      @media (max-width: 767px) {
        .markdown-body {
          padding: 16px;
        }
      }

      /* First fenced block is the agent banner. GitHub leaves it as a code block. */
      .markdown-body .language-text:first-of-type,
      .markdown-body > pre:first-of-type {
        position: relative;
        margin-top: 0;
        background: #0b0f14;
        border: 1px solid #1f6feb;
        border-radius: 12px;
        box-shadow: 0 0 0 1px rgba(88, 166, 255, 0.2), 0 16px 40px rgba(0, 0, 0, 0.28);
        padding-top: 2.4rem;
        overflow: hidden;
        max-width: 100%;
        box-sizing: border-box;
        container-type: inline-size;
      }
      .markdown-body .language-text:first-of-type .highlight,
      .markdown-body .language-text:first-of-type pre,
      .markdown-body > pre:first-of-type {
        background: transparent;
        border: 0;
        box-shadow: none;
        margin: 0;
      }
      .markdown-body .language-text:first-of-type pre,
      .markdown-body > pre:first-of-type {
        box-sizing: border-box;
        width: 100%;
        max-width: 100%;
        padding: 0 0.75rem 0.8rem;
        overflow: hidden;
        color: #d2f7d2;
        /* 87 columns. Size from the banner box so the right border and the last character stay inside 390px. */
        font-size: min(13px, 1.55vw);
        font-size: min(13px, calc((100cqi - 1.5rem) / 56));
        line-height: 1.35;
      }
      .markdown-body .language-text:first-of-type pre code,
      .markdown-body > pre:first-of-type code {
        color: inherit;
        background: transparent;
        white-space: pre;
        word-break: normal;
        font-size: inherit;
      }
      .markdown-body .language-text:first-of-type::before,
      .markdown-body > pre:first-of-type::before {
        content: "";
        position: absolute;
        z-index: 1;
        top: 14px;
        left: 14px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ff5f57;
        box-shadow: 16px 0 0 #febc2e, 32px 0 0 #28c840;
      }
      .markdown-body img {
        border: 0;
        background: transparent;
        box-shadow: none;
      }
      /* One width for the header photo and every event photo. */
      .markdown-body {
        --shot-width: min(300px, calc((100% - 12px) / 2));
      }
      .markdown-body .shot {
        width: var(--shot-width);
        max-width: 100%;
        min-width: 0;
        height: auto;
        flex: 0 0 auto;
        border: 0;
        background: transparent;
        box-shadow: none;
      }
      .markdown-body .hero-shot {
        margin: 24px auto;
        line-height: 0;
      }
      .markdown-body .hero-shot .shot {
        border-radius: 8px;
      }
      .markdown-body .site-nav {
        margin-top: 20px;
      }
      .markdown-body .photo-row {
        display: flex;
        flex-flow: row nowrap;
        justify-content: center;
        align-items: center;
        gap: 12px;
        width: 100%;
        margin: 0 auto 8px;
        border: 0;
        background: transparent;
      }
      @media (max-width: 600px) {
        .markdown-body {
          --shot-width: 100%;
        }
        .markdown-body .photo-row {
          flex-direction: column;
          align-items: stretch;
        }
      }
      .markdown-body .language-text:first-of-type::after,
      .markdown-body > pre:first-of-type::after {
        content: "jael.ee · agent";
        position: absolute;
        z-index: 1;
        top: 10px;
        left: 0;
        right: 0;
        text-align: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        letter-spacing: 0.04em;
        color: #8b949e;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <article class="markdown-body">
      {{ content }}
    </article>
  </body>
</html>
