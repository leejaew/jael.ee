<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{{ page.title | default: site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.9.0/github-markdown.min.css">
    <style>
      body {
        margin: 0;
      }
      @media (prefers-color-scheme: light) {
        body { background-color: #ffffff; }
      }
      @media (prefers-color-scheme: dark) {
        body { background-color: #0d1117; }
      }
      .markdown-body {
        box-sizing: border-box;
        min-width: 200px;
        max-width: 980px;
        margin: 0 auto;
        padding: 32px;
      }
      @media (max-width: 767px) {
        .markdown-body {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <article class="markdown-body">
      {{ content }}
    </article>
  </body>
</html>
